<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labirin</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, #0f0a1f 0%, #1a0f2e 50%, #2d1b4e 75%, #1a0f2e 100%);
    min-height: 100vh;
  }
  #app { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: .6rem .8rem; position: relative; }

  .header { text-align: center; flex: 0 0 auto; }
  .header h1 {
    font-size: clamp(1.3rem, 4vw, 2.2rem); font-weight: 800;
    background: linear-gradient(90deg, #a78bfa, #c084fc, #e879f9);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stats { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-top: .25rem; }
  .chip {
    font-size: clamp(.7rem, 1.8vw, .95rem); font-weight: 700; padding: .15rem .65rem; border-radius: 50px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(167,139,250,.3); color: #ddd6fe; white-space: nowrap;
  }
  .chip.hot { color: #fbbf24; border-color: rgba(251,191,36,.5); }

  #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: .3rem; }
  canvas { display: block; }

  .howto {
    flex: 0 0 auto; text-align: center; margin-top: .3rem; padding: .35rem .6rem; border-radius: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(167,139,250,.2);
    font-size: clamp(.7rem, 1.9vw, .95rem); font-weight: 600;
  }
  .howto b { color: #c084fc; }

  #toast {
    position: fixed; left: 50%; top: 18%; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    padding: .5rem 1.1rem; border-radius: 50px; font-weight: 800; font-size: clamp(.9rem, 3vw, 1.4rem);
    background: rgba(15,10,30,.85); border: 2px solid #fbbf24; color: #fde68a; z-index: 200;
    transition: opacity .3s, transform .3s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #podium {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 150;
    background: rgba(10,6,24,.78); backdrop-filter: blur(4px);
  }
  #podium.show { display: flex; }
  .podium-card {
    width: min(92vw, 460px); padding: 1.2rem 1.1rem; border-radius: 22px; text-align: center;
    background: linear-gradient(160deg, rgba(76,29,149,.9), rgba(30,15,60,.95));
    border: 2px solid rgba(251,191,36,.6); box-shadow: 0 0 40px rgba(167,139,250,.45);
    animation: pop .45s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .podium-card h2 { font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 800; color: #fde68a; margin-bottom: .6rem; }
  .podium-row {
    display: flex; align-items: center; gap: .6rem; padding: .5rem .7rem; margin: .35rem 0; border-radius: 14px;
    background: rgba(255,255,255,.08); font-weight: 700; font-size: clamp(.95rem, 3.4vw, 1.25rem);
  }
  .podium-row .medal { font-size: 1.6em; }
  .podium-row .nm { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium-row .pt { color: #4ade80; }
  .podium-row .tm { color: #c4b5fd; font-size: .75em; font-weight: 600; }
  .podium-note { margin-top: .6rem; font-size: clamp(.75rem, 2.4vw, .95rem); color: #c4b5fd; }

  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 160; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }

  /* Leaderboard (gaya sama game lain; v2-bootstrap.js ngerapihin di layar portrait) */
  #leaderboard {
    position: fixed; top: 1rem; right: 1rem; z-index: 100; min-width: 170px; max-height: 250px; overflow-y: auto;
    padding: .8rem 1rem; border-radius: 15px; backdrop-filter: blur(10px);
    background: rgba(255,255,255,.05); border: 1px solid rgba(167,139,250,.2);
  }
  #leaderboard .label { font-size: .9rem; margin-bottom: .5rem; text-align: center; color: #c084fc; font-weight: 700; }
  #lbList { display: flex; flex-direction: column; gap: .3rem; }
  .lb-row { display: flex; justify-content: space-between; gap: .5rem; padding: .25rem .5rem; font-size: .8rem; border-bottom: 1px solid rgba(255,255,255,.1); }
  .lb-rank { color: #fbbf24; font-weight: 700; width: 20px; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { color: #22c55e; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🌀 LABIRIN 🌀</h1>
    <div class="stats">
      <span class="chip" id="chipRound">Ronde 1</span>
      <span class="chip hot" id="chipFinish">🏁 0/3 sampai</span>
      <span class="chip" id="chipTime">⏱ --:--</span>
      <span class="chip" id="chipPlayers">👥 0</span>
    </div>
  </div>

  <div id="stage"><canvas id="maze"></canvas></div>

  <div class="howto">Komen <b>atas</b> · <b>bawah</b> · <b>kiri</b> · <b>kanan</b> atau <b>W A S D</b> — maks 3 langkah per komentar. 3 tercepat sampai 🏁 menang!</div>

  <div id="leaderboard">
    <div class="label">🏆 Top Skor</div>
    <div id="lbList"></div>
  </div>
</div>

<div id="toast"></div>
<div id="podium"><div class="podium-card" id="podiumCard"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>const socket = io();</script>
<script src="/shared/v2-bootstrap.js"></script>
<script src="/shared/game-switch-watcher.js"></script>
<script src="/shared/vote-overlay.js"></script>
<script>
(function () {
  const canvas = document.getElementById('maze');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let maze = null;               // payload 'update' terakhir
  let clockOffset = 0;           // serverTime - Date.now()
  let cell = 20, pad = 18;
  let lastRound = 0, lastFinishCount = 0;
  const avatars = new Map();     // nama -> { emoji, url }
  const imgCache = new Map();    // url -> Image
  const disp = new Map();        // nama -> posisi tampil (smoothing)
  const LEADERS_WITH_AVATAR = 5;
  const MEDALS = ['🥇', '🥈', '🥉'];

  // ---------- util ----------
  function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function getImg(url) {
    let img = imgCache.get(url);
    if (!img) { img = new Image(); img.referrerPolicy = 'no-referrer'; img.src = url; imgCache.set(url, img); }
    return img;
  }

  // ---------- layout ----------
  function layout() {
    if (!maze || !maze.cols) return;
    const r = stage.getBoundingClientRect();
    cell = Math.max(8, Math.floor(Math.min(r.width / maze.cols, r.height / (maze.rows + 1.8))));
    pad = Math.round(cell * 0.9);
    const w = cell * maze.cols, h = cell * maze.rows + pad * 2;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(layout).observe(stage);

  const cx = (x) => x * cell + cell / 2;
  const cy = (y) => pad + y * cell + cell / 2;

  // ---------- gambar ----------
  function drawWalls() {
    const { cols, rows, walls } = maze;
    ctx.lineWidth = Math.max(2, cell * 0.12);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#a78bfa';
    ctx.shadowColor = 'rgba(167,139,250,.7)';
    ctx.shadowBlur = cell * 0.25;
    ctx.beginPath();
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const w = walls[y * cols + x], x0 = x * cell, y0 = pad + y * cell;
        if (w & 1) { ctx.moveTo(x0, y0); ctx.lineTo(x0 + cell, y0); }
        if (w & 8) { ctx.moveTo(x0, y0); ctx.lineTo(x0, y0 + cell); }
        if (x === cols - 1 && (w & 2)) { ctx.moveTo(x0 + cell, y0); ctx.lineTo(x0 + cell, y0 + cell); }
        if (y === rows - 1 && (w & 4)) { ctx.moveTo(x0, y0 + cell); ctx.lineTo(x0 + cell, y0 + cell); }
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawMarkers() {
    const { start, exit, rows } = maze;
    ctx.fillStyle = 'rgba(34,197,94,.28)';
    ctx.fillRect(start.x * cell, pad + start.y * cell, cell, cell);
    ctx.fillStyle = 'rgba(251,191,36,.30)';
    ctx.fillRect(exit.x * cell, pad + exit.y * cell, cell, cell);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(cell * 0.42) + 'px Poppins, sans-serif';
    ctx.fillStyle = '#4ade80';
    ctx.fillText('▼ MASUK', cx(start.x), pad * 0.5);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('KELUAR ▼', cx(exit.x), pad + rows * cell + pad * 0.5);
    ctx.font = Math.round(cell * 0.62) + 'px sans-serif';
    ctx.fillText('🏁', cx(exit.x), cy(exit.y));
  }

  function drawDot(name, px, py) {
    const h = hash(name);
    const ox = ((h % 97) / 97 - 0.5) * cell * 0.5;
    const oy = (((h >> 7) % 89) / 89 - 0.5) * cell * 0.5;
    ctx.fillStyle = 'hsl(' + (h % 360) + ',75%,62%)';
    ctx.beginPath(); ctx.arc(px + ox, py + oy, Math.max(2.5, cell * 0.17), 0, Math.PI * 2); ctx.fill();
  }

  function drawLeader(p, px, py, order) {
    const r = cell * 0.4;
    const av = avatars.get(p.n);
    ctx.save();
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = 'hsl(' + (hash(p.n) % 360) + ',65%,45%)';
    ctx.fill();
    ctx.clip();
    if (av && av.url) {
      const img = getImg(av.url);
      if (img.complete && img.naturalWidth) ctx.drawImage(img, px - r, py - r, r * 2, r * 2);
    } else if (av && av.emoji) {
      ctx.font = Math.round(r * 1.5) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(av.emoji, px, py + r * 0.08);
    } else {
      ctx.fillStyle = '#fff'; ctx.font = '800 ' + Math.round(r * 1.2) + 'px Poppins, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.n.charAt(0).toUpperCase(), px, py + r * 0.05);
    }
    ctx.restore();
    ctx.lineWidth = Math.max(2, cell * 0.09);
    ctx.strokeStyle = p.r ? '#fbbf24' : '#ffffff';
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.stroke();

    if (p.r) {
      ctx.font = Math.round(cell * 0.5) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(MEDALS[p.r - 1] || '🏅', px + r * 0.8, py - r * 0.8);
    }
    if (order < 3) {
      const label = p.n.length > 10 ? p.n.slice(0, 9) + '…' : p.n;
      ctx.font = '700 ' + Math.round(cell * 0.36) + 'px Poppins, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(15,10,30,.95)';
      ctx.strokeText(label, px, py - r - 3);
      ctx.fillStyle = '#fff'; ctx.fillText(label, px, py - r - 3);
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    if (!maze || !maze.walls || !maze.walls.length) return;
    const w = cell * maze.cols, h = cell * maze.rows + pad * 2;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    ctx.fillRect(0, pad, w, cell * maze.rows);

    drawMarkers();
    drawWalls();

    const players = maze.players || [];
    const pos = players.map((p) => {
      let d = disp.get(p.n);
      if (!d) { d = { x: p.x, y: p.y }; disp.set(p.n, d); }
      d.x += (p.x - d.x) * 0.3; d.y += (p.y - d.y) * 0.3;
      return { p, px: cx(d.x), py: cy(d.y) };
    });
    for (let i = pos.length - 1; i >= LEADERS_WITH_AVATAR; i--) drawDot(pos[i].p.n, pos[i].px, pos[i].py);
    for (let i = Math.min(LEADERS_WITH_AVATAR, pos.length) - 1; i >= 0; i--) drawLeader(pos[i].p, pos[i].px, pos[i].py, i);
  }

  // ---------- HUD ----------
  const chipRound = document.getElementById('chipRound');
  const chipFinish = document.getElementById('chipFinish');
  const chipTime = document.getElementById('chipTime');
  const chipPlayers = document.getElementById('chipPlayers');
  const toastEl = document.getElementById('toast');
  const podiumEl = document.getElementById('podium');
  const podiumCard = document.getElementById('podiumCard');
  let toastTimer = null;

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function confetti() {
    const colors = ['#fbbf24', '#a78bfa', '#4ade80', '#f472b6', '#60a5fa'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
      c.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  function renderPodium(m) {
    podiumCard.textContent = '';
    const h2 = document.createElement('h2');
    h2.textContent = m.finishers.length ? '🏆 Pemenang Labirin!' : '⏰ Waktu Habis!';
    podiumCard.appendChild(h2);

    m.finishers.forEach((f) => {
      const row = document.createElement('div'); row.className = 'podium-row';
      const medal = document.createElement('span'); medal.className = 'medal'; medal.textContent = MEDALS[f.rank - 1] || '🏅';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = f.player;
      const tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = (f.ms / 1000).toFixed(1) + ' dtk';
      const pt = document.createElement('span'); pt.className = 'pt'; pt.textContent = '+' + f.points;
      row.append(medal, nm, tm, pt);
      podiumCard.appendChild(row);
    });

    const note = document.createElement('div'); note.className = 'podium-note';
    if (!m.finishers.length) {
      note.textContent = m.closest && m.closest.length
        ? 'Belum ada yang sampai. Paling dekat: ' + m.closest.join(', ')
        : 'Belum ada yang sampai ke pintu keluar.';
    } else if (m.finishers.length < m.winnersNeeded) {
      note.textContent = 'Waktu habis sebelum juara terisi semua.';
    } else {
      note.textContent = 'Labirin baru sebentar lagi…';
    }
    podiumCard.appendChild(note);
  }

  function updateHud(m) {
    chipRound.textContent = 'Ronde ' + m.round;
    chipFinish.textContent = '🏁 ' + m.finishers.length + '/' + m.winnersNeeded + ' sampai';
    chipPlayers.textContent = '👥 ' + m.totalPlayers;
  }

  setInterval(() => {
    if (!maze) return;
    if (maze.phase === 'racing') chipTime.textContent = '⏱ ' + fmtTime(maze.endsAt - (Date.now() + clockOffset));
    else chipTime.textContent = '⏱ selesai';
  }, 250);

  // ---------- socket ----------
  socket.on('update', (m) => {
    if (!m || !m.walls) return;
    clockOffset = m.serverTime - Date.now();

    const sameMaze = maze && m.round === lastRound && maze.cols === m.cols && maze.rows === m.rows;
    const newRound = m.round !== lastRound;
    if (newRound) { lastRound = m.round; lastFinishCount = 0; disp.clear(); podiumEl.classList.remove('show'); }

    // toast tiap ada yang baru finish
    if (m.finishers.length > lastFinishCount) {
      const f = m.finishers[m.finishers.length - 1];
      showToast((MEDALS[f.rank - 1] || '🏅') + ' ' + f.player + ' sampai! +' + f.points);
    }
    lastFinishCount = m.finishers.length;

    maze = m;
    if (!sameMaze) layout();
    updateHud(m);

    if (m.phase === 'racing') {
      podiumEl.classList.remove('show');
    } else if (!podiumEl.classList.contains('show')) {
      renderPodium(m);
      podiumEl.classList.add('show');
      if (m.finishers.length) confetti();
    }
  });

  // avatar (event dari room.js): dipakai buat 5 pemain terdepan
  socket.on('avatar:spawn', (d) => {
    if (!d || !d.player) return;
    avatars.set(d.player, { emoji: d.emoji, url: d.avatarType === 'tiktok' ? d.profileUrl : null });
  });
  socket.on('avatar:sync', (list) => {
    (list || []).forEach((d) => avatars.set(d.player, { emoji: d.emoji, url: d.avatarType === 'tiktok' ? d.profileUrl : null }));
  });
  socket.on('avatar:remove', (d) => { if (d && d.player) avatars.delete(d.player); });
  socket.on('avatar:reset', () => avatars.clear());

  socket.on('leaderboard:update', (list) => {
    const el = document.getElementById('lbList');
    el.textContent = '';
    if (!list || !list.length) {
      const e = document.createElement('div');
      e.style.cssText = 'text-align:center;opacity:.5;font-size:.75rem';
      e.textContent = 'Belum ada';
      el.appendChild(e);
      return;
    }
    list.slice(0, 10).forEach((p, i) => {
      const row = document.createElement('div'); row.className = 'lb-row';
      const rk = document.createElement('span'); rk.className = 'lb-rank'; rk.textContent = (i + 1) + '.';
      const nm = document.createElement('span'); nm.className = 'lb-name'; nm.textContent = p.player;
      const sc = document.createElement('span'); sc.className = 'lb-score'; sc.textContent = p.score || 0;
      row.append(rk, nm, sc);
      el.appendChild(row);
    });
  });

  socket.emit('getState');
  requestAnimationFrame(frame);

  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
  document.addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  });
})();
</script>
</body>
</html>
