<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14101f">
<style>
  :root {
    --bg-deep: #14101f;
    --panel: #1f1a33;
    --panel-light: #2a2340;
    --accent: #8b6ef5;
    --accent-soft: rgba(139, 110, 245, 0.25);
    --gold: #f5b942;
    --silver: #c9c9d4;
    --bronze: #d08a5b;
    --text-primary: #f5f3fb;
    --text-muted: #9b93b8;
    --correct: #4ade80;
    --wrong: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex; flex-direction: column;
    width: 100vw; height: 100vh;
    padding: 3vh 3vw 2vh;
    gap: 1.6vh;
  }

  #categoryBar {
    flex: 0 0 auto;
    background: var(--gold);
    border-radius: 12px;
    padding: 6px 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(245, 185, 66, 0.3);
  }
  #categoryBar .categoryBar-text {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: clamp(11px, 2.8vw, 14px); color: #5c3d00;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  #questionWrap {
    flex: 0 0 auto; position: relative;
    background: var(--panel); border-radius: 16px;
    padding: 18px 16px; min-height: 12vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #questionText {
    font-family: 'Baloo 2', sans-serif; font-weight: 700;
    font-size: clamp(16px, 4.4vw, 22px); line-height: 1.35;
    color: var(--text-primary);
  }
  #toast {
    position: absolute; top: -6px; left: 50%;
    transform: translate(-50%, -130%);
    background: var(--accent); color: #14101f;
    padding: 10px 18px; border-radius: 999px; font-weight: 700;
    font-size: clamp(12px, 3vw, 15px); white-space: nowrap;
    box-shadow: 0 6px 20px var(--accent-soft);
    opacity: 0; transition: transform .35s ease, opacity .35s ease;
    pointer-events: none; z-index: 5;
  }
  #toast.show { transform: translate(-50%, 0%); opacity: 1; }

  #optionsWrap {
    flex: 1; display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px; min-height: 0;
  }
  .option-card {
    background: var(--panel); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 10px;
    min-height: 0; border: 2px solid transparent;
    transition: background .3s ease, border-color .3s ease, transform .3s ease;
  }
  .option-letter {
    flex: 0 0 auto; width: clamp(40px, 9.5vw, 56px); height: clamp(40px, 9.5vw, 56px);
    border-radius: 50%; background: var(--panel-light);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: clamp(19px, 5vw, 26px); color: var(--accent);
  }
  .option-text {
    flex: 1; font-weight: 600;
    font-size: clamp(12px, 3vw, 15px); line-height: 1.25;
    overflow: hidden;
  }
  .option-card.is-correct {
    background: rgba(74, 222, 128, 0.18); border-color: var(--correct);
  }
  .option-card.is-correct .option-letter { background: var(--correct); color: #0b2914; }
  .option-card.is-winner { transform: scale(1.03); }
  .option-card.is-wrong-picked {
    background: rgba(248, 113, 113, 0.14); border-color: var(--wrong);
  }
  .option-card.is-dim { opacity: 0.45; }

  #leaderboard {
    position: absolute; top: 8px; right: 8px; z-index: 4;
    background: rgba(31, 26, 51, 0.82); border-radius: 12px;
    padding: 8px 10px; display: flex; flex-direction: column;
    min-width: 120px; max-width: 44vw;
  }
  #leaderboard .label {
    font-family: 'Baloo 2', sans-serif; font-weight: 600;
    font-size: 10px; color: var(--gold);
    margin-bottom: 5px; display: flex; align-items: center; gap: 4px;
  }
  #lbList { display: flex; flex-direction: column; gap: 3px; }
  .lb-row { display: flex; align-items: center; gap: 6px; }
  .lb-rank {
    font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: 10px; width: 12px; text-align: center; color: var(--text-muted);
  }
  .lb-row:nth-child(1) .lb-rank { color: var(--gold); }
  .lb-row:nth-child(2) .lb-rank { color: var(--silver); }
  .lb-row:nth-child(3) .lb-rank { color: var(--bronze); }
  .lb-name { flex: 1; font-weight: 600; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 20vw; }
  .lb-score { font-family: 'Baloo 2', sans-serif; font-weight: 700; color: var(--accent); font-size: 10.5px; }
  .empty-hint { color: var(--text-muted); font-size: 13px; text-align: center; padding-top: 10px; }

  #banner {
    position: fixed; bottom: 2vh; left: 50%; transform: translateX(-50%);
    background: var(--panel-light); border: 1px solid var(--accent);
    color: var(--text-primary); padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; display: none; z-index: 10;
    text-align: center; max-width: 90vw;
  }
  #banner.show { display: block; }

  @media (orientation: landscape) {
    #app {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "category category"
        "question options"
        "avatars  avatars";
      gap: 1.4vh 1.6vw;
      padding: 2vh 2.4vw;
    }
    #categoryBar { grid-area: category; }
    #questionWrap { grid-area: question; min-height: 0; }
    #optionsWrap { grid-area: options; }
    #avatarZone { grid-area: avatars; }
  }

  #avatarZone {
    flex: 0 0 64px;
    position: relative;
    background: transparent;
    border-radius: 12px;
    overflow: visible;
    min-height: 64px;
  }
  .mini-avatar {
    position: absolute;
    bottom: 4px;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
    will-change: left;
  }
  .mini-avatar .emoji {
    display: block; font-size: 26px; line-height: 1;
    animation: avatarBob 0.5s ease-in-out infinite alternate;
  }
  .mini-avatar.facing-left .emoji { transform: scaleX(-1); }
  .mini-avatar .name-tag {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 8px;
    color: var(--text-primary); background: rgba(0,0,0,0.45);
    padding: 1px 6px; border-radius: 999px; margin-bottom: 2px;
    white-space: nowrap; max-width: 84px; overflow: hidden; text-overflow: ellipsis;
    order: -1;
  }
  .mini-avatar .comment-bubble {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 9.5px;
    color: #14101f; background: var(--text-primary);
    padding: 3px 9px; border-radius: 10px; margin-bottom: 4px;
    white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    position: relative; order: -2;
  }
  .mini-avatar .comment-bubble::after {
    content: '';
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    border-width: 4px 4px 0 4px; border-style: solid;
    border-color: var(--text-primary) transparent transparent transparent;
  }
  @keyframes avatarBob {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="categoryBar">
      <span class="categoryBar-text">🎯 Trivia</span>
    </div>

    <div id="questionWrap">
      <div id="toast"></div>
      <div id="questionText">Menunggu soal...</div>
    </div>

    <div id="optionsWrap"></div>

    <div id="avatarZone"></div>
  </div>

  <div id="leaderboard">
    <div class="label">🏆 Papan Skor</div>
    <div id="lbList"><div class="empty-hint">Belum ada</div></div>
  </div>

  <div id="banner"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
  </script>
  <script src="/shared/v2-bootstrap.js"></script>
  <script src="/shared/game-switch-watcher.js"></script>
  <script src="/shared/vote-overlay.js"></script>
  <script>
    const categoryText = document.querySelector('.categoryBar-text');
    const questionText = document.getElementById('questionText');
    const optionsWrap = document.getElementById('optionsWrap');

    function renderState(data) {
      categoryText.textContent = '🎯 ' + (data.category || 'Trivia');
      questionText.textContent = data.question || 'Menunggu soal...';

      optionsWrap.innerHTML = '';
      (data.options || []).forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';

        if (data.answered) {
          if (opt.letter === data.correctLetter) {
            card.classList.add('is-correct');
            if (opt.letter === data.winnerLetter) card.classList.add('is-winner');
          } else {
            card.classList.add('is-dim');
          }
        }

        card.innerHTML = `
          <div class="option-letter">${opt.letter}</div>
          <div class="option-text">${opt.text}</div>
        `;
        optionsWrap.appendChild(card);
      });
    }

    function showToast(data) {
      const toast = document.getElementById('toast');
      toast.textContent = `${data.player} benar! (+${data.points})`;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderLeaderboard(list) {
      const lb = document.getElementById('lbList');
      if (!list.length) { lb.innerHTML = '<div class="empty-hint">Belum ada</div>'; return; }
      lb.innerHTML = list.map((row, i) => `
        <div class="lb-row">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${row.player}</span>
          <span class="lb-score">${row.score}</span>
        </div>
      `).join('');
    }

    function showBanner(msg) {
      const banner = document.getElementById('banner');
      banner.textContent = msg;
      banner.classList.add('show');
    }
    function hideBanner() {
      document.getElementById('banner').classList.remove('show');
    }

    socket.on('game:switched', () => window.location.reload());
    socket.on('update', (data) => renderState(data));
    socket.on('answer:correct', (data) => showToast(data));
    socket.on('leaderboard:update', (list) => renderLeaderboard(list));
    socket.on('puzzle:completed', () => showBanner('🎉 Soal berikutnya lagi disiapin...'));
    socket.on('puzzle:new', () => hideBanner());
    socket.on('puzzle:error', (data) => { showBanner('⚠️ ' + data.message); setTimeout(hideBanner, 4000); });

    // ===== Avatar viewer =====
    const avatarZone = document.getElementById('avatarZone');
    const activeAvatars = {};

    function spawnAvatar(player, emoji) {
      if (activeAvatars[player]) return;
      const el = document.createElement('div');
      el.className = 'mini-avatar';
      el.innerHTML = `<span class="emoji">${emoji}</span><span class="name-tag">${player}</span>`;
      avatarZone.appendChild(el);
      el.style.left = (Math.random() * Math.max(0, avatarZone.clientWidth - 40)) + 'px';
      activeAvatars[player] = { el, timer: null };
      walkRandomly(player);
    }

    function walkRandomly(player) {
      const entry = activeAvatars[player];
      if (!entry) return;
      const zoneWidth = avatarZone.clientWidth || 300;
      const avatarWidth = entry.el.offsetWidth || 40;
      const maxLeft = Math.max(0, zoneWidth - avatarWidth);
      const currentLeft = parseFloat(entry.el.style.left) || 0;
      const targetLeft = Math.random() * maxLeft;
      const duration = 2.5 + Math.random() * 3;
      entry.el.classList.toggle('facing-left', targetLeft < currentLeft);
      entry.el.style.transition = `left ${duration}s linear`;
      entry.el.style.left = targetLeft + 'px';
      entry.timer = setTimeout(() => walkRandomly(player), duration * 1000);
    }

    function showComment(player, text) {
      const entry = activeAvatars[player];
      if (!entry) return;
      let bubble = entry.el.querySelector('.comment-bubble');
      if (!bubble) {
        bubble = document.createElement('span');
        bubble.className = 'comment-bubble';
        entry.el.appendChild(bubble);
      }
      bubble.textContent = text;
      clearTimeout(entry.commentTimer);
      entry.commentTimer = setTimeout(() => bubble.remove(), 4000);
    }

    function clearAllAvatars() {
      Object.values(activeAvatars).forEach(({ el, timer, commentTimer }) => {
        clearTimeout(timer); clearTimeout(commentTimer); el.remove();
      });
      for (const key in activeAvatars) delete activeAvatars[key];
    }

    function removeAvatar(player) {
      const entry = activeAvatars[player];
      if (!entry) return;
      clearTimeout(entry.timer); clearTimeout(entry.commentTimer);
      entry.el.remove(); delete activeAvatars[player];
    }

    socket.on('avatar:spawn', ({ player, emoji }) => spawnAvatar(player, emoji));
    socket.on('avatar:sync', (list) => { clearAllAvatars(); list.forEach(({ player, emoji }) => spawnAvatar(player, emoji)); });
    socket.on('avatar:reset', clearAllAvatars);
    socket.on('avatar:remove', ({ player }) => removeAvatar(player));
    socket.on('chat:comment', ({ player, text }) => showComment(player, text));

    // ===== Nahan layar HP biar gak mati sendiri, kayak pas nonton video =====
    let wakeLock = null;
    let noSleepStarted = false;

    function startNoSleepFallback() {
      if (noSleepStarted) return;
      noSleepStarted = true;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 2; canvas.height = 2;
        canvas.getContext('2d').fillRect(0, 0, 2, 2);
        const stream = canvas.captureStream(1);
        const video = document.createElement('video');
        video.muted = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('autoplay', '');
        video.style.cssText = 'position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
        video.srcObject = stream;
        document.body.appendChild(video);
        video.play().catch(() => {});
      } catch (e) {
        console.error('⚠️ Fallback nahan layar gagal:', e.message);
      }
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          return;
        } catch (e) {
          console.error('⚠️ Wake Lock API gagal, pakai fallback:', e.message);
        }
      }
      startNoSleepFallback();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLock === null) requestWakeLock();
    });

    requestWakeLock();

    document.body.addEventListener('click', function goFullscreen() {
      document.documentElement.requestFullscreen().catch(() => {});
      requestWakeLock();
      document.body.removeEventListener('click', goFullscreen);
    }, { once: true });
  </script>
</body>
</html>
