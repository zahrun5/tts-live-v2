<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #07161a 0%, #0c2328 50%, #123238 75%, #0c2328 100%);
  }
  body {
    font-family: 'Poppins', sans-serif; color: #fff;
  }
  #app { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: .6rem .8rem; position: relative; }

  .header { text-align: center; flex: 0 0 auto; }
  .header h1 {
    font-size: clamp(1.3rem, 4vw, 2.2rem); font-weight: 800;
    background: linear-gradient(90deg, #5eead4, #a3e635, #facc15);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stats { display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin-top: .25rem; }
  .chip {
    font-size: clamp(.7rem, 1.8vw, .95rem); font-weight: 700; padding: .15rem .65rem; border-radius: 50px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(94,234,212,.3); color: #ccfbf1; white-space: nowrap;
  }
  .chip.hot { color: #fbbf24; border-color: rgba(251,191,36,.5); }

  .howto {
    flex: 0 0 auto; text-align: center; margin-top: .3rem; padding: .35rem .6rem; border-radius: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(94,234,212,.2);
    font-size: clamp(.7rem, 1.9vw, .95rem); font-weight: 600; line-height: 1.35;
  }
  .howto b { color: #a3e635; }

  #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: .3rem; }
  canvas { display: block; }

  #dicePanel {
    flex: 0 0 auto; margin-top: .3rem; padding: .5rem .7rem; border-radius: 16px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(94,234,212,.25);
    display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; align-items: center;
  }
  #die {
    width: clamp(54px, 15vw, 84px); height: clamp(54px, 15vw, 84px); border-radius: 16%;
    background: #fff7e0; box-shadow: 0 4px 0 #c9b27a, 0 0 18px rgba(250,204,21,.35);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 11%; gap: 6%; grid-row: span 2;
  }
  #die i { border-radius: 50%; background: transparent; }
  #die i.on { background: #1f2937; }
  #die.rolling { animation: tumble .45s linear; }
  @keyframes tumble { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.12); } 100% { transform: rotate(360deg) scale(1); } }
  #diceWho { font-size: clamp(.95rem, 3.2vw, 1.35rem); font-weight: 800; color: #fde68a; min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #diceSub { font-size: clamp(.75rem, 2.4vw, 1rem); font-weight: 600; color: #99f6e4; min-height: 1.3em; }
  #recent { grid-column: 1 / -1; display: flex; gap: .35rem; flex-wrap: wrap; justify-content: center; min-height: 1.4rem; }
  .rc { font-size: clamp(.62rem, 1.8vw, .8rem); font-weight: 700; padding: .1rem .5rem; border-radius: 50px; background: rgba(255,255,255,.08); color: #e2e8f0; white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }

  #toast {
    position: fixed; left: 50%; top: 18%; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    padding: .5rem 1.1rem; border-radius: 50px; font-weight: 800; font-size: clamp(.9rem, 3vw, 1.4rem);
    background: rgba(7,22,26,.88); border: 2px solid #fbbf24; color: #fde68a; z-index: 200;
    transition: opacity .3s, transform .3s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #mysteryBanner {
    position: fixed; left: 50%; top: 12%; transform: translate(-50%, 0); opacity: 0; pointer-events: none;
    padding: .7rem 1.5rem; border-radius: 20px; font-weight: 800; font-size: clamp(1rem, 3.5vw, 1.6rem);
    background: linear-gradient(135deg, rgba(168,85,247,.95), rgba(217,70,239,.95));
    border: 3px solid #fbbf24; color: #fff; z-index: 210; text-align: center;
    box-shadow: 0 8px 30px rgba(168,85,247,.6);
    transition: opacity .4s, transform .4s;
  }
  #mysteryBanner.show { opacity: 1; transform: translate(-50%, 0) scale(1.05); }

  #podium {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 150;
    background: rgba(4,14,17,.8); backdrop-filter: blur(4px);
  }
  #podium.show { display: flex; }
  .podium-card {
    width: min(92vw, 460px); padding: 1.2rem 1.1rem; border-radius: 22px; text-align: center;
    background: linear-gradient(160deg, rgba(15,76,70,.92), rgba(8,32,38,.96));
    border: 2px solid rgba(251,191,36,.6); box-shadow: 0 0 40px rgba(94,234,212,.4);
    animation: pop .45s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .podium-card h2 { font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 800; color: #fde68a; margin-bottom: .6rem; }
  .podium-row {
    display: flex; align-items: center; gap: .6rem; padding: .5rem .7rem; margin: .35rem 0; border-radius: 14px;
    background: rgba(255,255,255,.08); font-weight: 700; font-size: clamp(.95rem, 3.4vw, 1.25rem);
  }
  .podium-row .medal { font-size: 1.6em; }
  .podium-row .nm { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium-row .pt { color: #4ade80; }
  .podium-row .tm { color: #99f6e4; font-size: .75em; font-weight: 600; }
  .podium-note { margin-top: .6rem; font-size: clamp(.75rem, 2.4vw, .95rem); color: #99f6e4; }

  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 160; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }

  #leaderboard {
    position: fixed; top: 1rem; right: 1rem; z-index: 100; min-width: 170px; max-height: 250px; overflow-y: auto;
    padding: .8rem 1rem; border-radius: 15px; backdrop-filter: blur(10px);
    background: rgba(255,255,255,.05); border: 1px solid rgba(94,234,212,.2);
  }
  #leaderboard .label { font-size: .9rem; margin-bottom: .5rem; text-align: center; color: #5eead4; font-weight: 700; }
  #lbList { display: flex; flex-direction: column; gap: .3rem; }
  .lb-row { display: flex; justify-content: space-between; gap: .5rem; padding: .25rem .5rem; font-size: .8rem; border-bottom: 1px solid rgba(255,255,255,.1); }
  .lb-rank { color: #fbbf24; font-weight: 700; width: 20px; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { color: #22c55e; font-weight: 700; }

  #leadStrip {
    flex: 0 0 auto; display: flex; justify-content: center; gap: clamp(.4rem, 2.2vw, 1rem);
    margin-top: .3rem; min-height: clamp(110px, 20vw, 130px); flex-wrap: wrap;
  }
  .lead {
    width: clamp(60px, 16vw, 90px); display: flex; flex-direction: column; align-items: center;
    gap: 3px; min-width: 0;
  }
  .lead .av {
    width: clamp(32px, 9vw, 48px); height: clamp(32px, 9vw, 48px); border-radius: 50%;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: #0f3a42; font-weight: 800; font-size: clamp(.9rem, 3vw, 1.2rem);
    border: 2px solid #fff; position: relative;
  }
  .lead.done .av { border-color: #fbbf24; }
  .lead .av img { width: 100%; height: 100%; object-fit: cover; }
  .lead .bar {
    width: 100%; height: 7px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.5);
  }
  .lead .staminaBar {
    width: 100%; height: 5px; border-radius: 3px;
    background: rgba(0,0,0,.3); border: 1px solid rgba(94,234,212,.3);
    overflow: hidden; position: relative;
  }
  .lead .staminaFill {
    height: 100%; background: linear-gradient(90deg, #22c55e, #84cc16);
    transition: width .3s;
  }
  .lead .nm {
    max-width: 100%; font-size: clamp(.6rem, 1.9vw, .78rem); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lead .ps {
    font-size: clamp(.55rem, 1.7vw, .7rem); font-weight: 600; color: #99f6e4;
    white-space: nowrap;
  }
  .lead .teamLabel {
    font-size: clamp(.65rem, 2vw, .85rem); font-weight: 700;
    padding: .1rem .4rem; border-radius: 8px;
    background: rgba(255,255,255,.15);
  }

  #turnBar {
    flex: 0 0 auto; margin-top: .3rem; padding: .3rem .8rem; border-radius: 12px;
    text-align: center; font-weight: 800; font-size: clamp(.8rem, 2.8vw, 1.1rem);
    background: rgba(94,234,212,.12); border: 2px solid rgba(94,234,212,.5);
    color: #ccfbf1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #turnBar.lobby { background: rgba(250,204,21,.15); border-color: #facc15; color: #fde68a; }
  #turnBar:empty { display: none; }
  .lead.turn .av { border-color: #5eead4; box-shadow: 0 0 0 3px rgba(94,234,212,.55); }

  #eventBar {
    flex: 0 0 auto; display: none; margin-top: .3rem; padding: .3rem .8rem;
    border-radius: 12px; text-align: center; font-weight: 800;
    font-size: clamp(.8rem, 2.8vw, 1.1rem);
  }
  #eventBar.show { display: block; }
  #eventBar.warn {
    background: rgba(250,204,21,.18); border: 2px solid #facc15; color: #fde68a;
    animation: evpulse .6s infinite alternate;
  }
  #eventBar.active {
    background: rgba(94,234,212,.18); border: 2px solid #5eead4; color: #ccfbf1;
  }
  @keyframes evpulse { from { opacity: .6; } to { opacity: 1; } }
  #app.shield { box-shadow: inset 0 0 50px rgba(56,189,248,.5); }

  /* Fullscreen button */
  #fullscreenBtn {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 9999;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(94,234,212,.2);
    border: 2px solid rgba(94,234,212,.6);
    color: #5eead4;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    padding: 0;
  }
  #fullscreenBtn:hover {
    background: rgba(94,234,212,.35);
    transform: scale(1.05);
  }
  #fullscreenBtn:active {
    transform: scale(0.95);
  }

  #die { display: none; }
  #dicePanel { grid-template-columns: 1fr; }

  @media (prefers-reduced-motion: reduce) {
    #die.rolling { animation: none; }
    .podium-card { animation: none; }
  }
</style>

<script>
// Fullscreen API support
function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    var docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(function(err) { console.log('Fullscreen error:', err); });
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(function(err) { console.log('Exit fullscreen error:', err); });
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}

// Update button icon based on fullscreen state
function updateFullscreenBtn() {
  var btn = document.getElementById('fullscreenBtn');
  if (!btn) return;
  var isFS = document.fullscreenElement || document.webkitFullscreenElement;
  btn.innerHTML = isFS ? '⛶' : '⛶';
  btn.title = isFS ? 'Exit Fullscreen (F11)' : 'Fullscreen (F11)';
}

document.addEventListener('fullscreenchange', updateFullscreenBtn);
document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

// Button click handler
document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

// Keyboard shortcut: F11
document.addEventListener('keydown', function(e) {
  if (e.key === 'F11') {
    e.preventDefault();
    toggleFullscreen();
  }
});
</script>
<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let game = null;
  let clockOffset = 0;
  let cell = 30, padTop = 14;
  let lastRound = 0, lastFinishCount = 0;
  let lastMysterySeq = null;
  const avatars = new Map();
  const scores = new Map();
  const imgCache = new Map();
  const disp = new Map();
  let snakeGeo = new Map();
  let lastFrameT = performance.now();

  const HOP_MS = 220;
  const HOP_MIN_MS = 70;
  const HOP_CATCHUP_MS = 12;
  const HOP_HEIGHT = 0.42;
  const SLIDE_MS = 750;
  const MAX_QUEUE = 40;
  const LEADERS_IN_STRIP = 6;
  const PAWN_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7', '#f97316'];
  const TEAM_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7', '#f97316'];
  const DICE_SHOW_MS = 1600;
  const DICE_TUMBLE_MS = 450;
  const MEDALS = ['🥇', '🥈', '🥉'];
  const SNAKE_COLORS = ['#ef4444', '#f97316', '#a3e635', '#22d3ee', '#c084fc', '#f472b6', '#facc15', '#34d399'];
  const PIPS = [[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];

  function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function getImg(url) {
    let img = imgCache.get(url);
    if (!img) { img = new Image(); img.referrerPolicy = 'no-referrer'; img.src = url; imgCache.set(url, img); }
    return img;
  }

  function cellXY(n) {
    if (n <= 0) return { x: 0, y: 10 };
    const i = n - 1, rowB = Math.floor(i / 10);
    let col = i % 10;
    if (rowB % 2 === 1) col = 9 - col;
    return { x: col, y: 9 - rowB };
  }
  const px = (gx) => (gx + 0.5) * cell;
  const py = (gy) => padTop + (gy + 0.5) * cell;

  function snakePoint(g, t) {
    const dx = g.bx - g.ax, dy = g.by - g.ay;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const off = Math.sin(t * Math.PI * g.k) * g.amp * g.sign;
    return { x: g.ax + dx * t + nx * off, y: g.ay + dy * t + ny * off };
  }

  function buildGeo(m) {
    snakeGeo = new Map();
    (m.snakes || []).forEach(([head, tail], i) => {
      const a = cellXY(head), b = cellXY(tail);
      const h = hash(head + ':' + tail);
      snakeGeo.set(head, {
        head, tail, ax: a.x, ay: a.y, bx: b.x, by: b.y,
        k: 2 + (h % 3), amp: 0.32 + (h % 5) * 0.04, sign: h % 2 ? 1 : -1,
        color: SNAKE_COLORS[i % SNAKE_COLORS.length]
      });
    });
  }

  function layout() {
    if (!game) return;
    const r = stage.getBoundingClientRect();
    cell = Math.max(10, Math.floor(Math.min(r.width / 10, r.height / 11.1)));
    padTop = Math.round(cell * 0.45);
    const w = cell * 10, h = padTop + cell * 11;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(layout).observe(stage);

  const SPECIAL_STYLE = {
    again: { fill: 'rgba(250,204,21,.38)', icon: '🔁' },
    back: { fill: 'rgba(239,68,68,.36)', icon: '⏪' },
    fwd: { fill: 'rgba(74,222,128,.36)', icon: '⏩' },
    mystery: { fill: 'rgba(168,85,247,.42)', icon: '❓' }
  };

  function drawCells() {
    const specials = new Map((game.specials || []).map((s) => [s.c, s]));
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (let n = 1; n <= 100; n++) {
      const { x, y } = cellXY(n);
      const x0 = x * cell, y0 = padTop + y * cell;
      ctx.fillStyle = (x + y) % 2 ? '#14434a' : '#195660';
      ctx.fillRect(x0, y0, cell, cell);
      const sp = specials.get(n);
      if (sp && SPECIAL_STYLE[sp.t]) {
        ctx.fillStyle = SPECIAL_STYLE[sp.t].fill;
        ctx.fillRect(x0, y0, cell, cell);
      }
      if (n === 100) {
        ctx.fillStyle = 'rgba(251,191,36,.45)';
        ctx.fillRect(x0, y0, cell, cell);
      }
      if (sp && SPECIAL_STYLE[sp.t]) {
        ctx.font = Math.round(cell * 0.3) + 'px sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        ctx.fillText(SPECIAL_STYLE[sp.t].icon, x0 + cell * 0.97, y0 + cell * 0.97);
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      }
    }
    ctx.strokeStyle = 'rgba(94,234,212,.18)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      ctx.moveTo(i * cell, padTop); ctx.lineTo(i * cell, padTop + 10 * cell);
      ctx.moveTo(0, padTop + i * cell); ctx.lineTo(10 * cell, padTop + i * cell);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(94,234,212,.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(0, padTop, 10 * cell, 10 * cell);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const f = cellXY(100);
    ctx.font = Math.round(cell * 0.5) + 'px sans-serif';
    ctx.fillText('🏁', px(f.x), py(f.y) + cell * 0.08);
    ctx.font = '700 ' + Math.round(cell * 0.3) + 'px Poppins, sans-serif';
    ctx.fillStyle = '#86efac';
    ctx.textAlign = 'left';
    ctx.fillText('◀ MULAI', cell * 1.0, py(10));
  }

  function drawNumbers() {
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = '700 ' + Math.round(cell * 0.26) + 'px Poppins, sans-serif';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, cell * 0.08);
    for (let n = 1; n <= 100; n++) {
      const { x, y } = cellXY(n);
      const tx = x * cell + cell * 0.08, ty = padTop + y * cell + cell * 0.05;
      ctx.strokeStyle = 'rgba(7,22,26,.85)';
      ctx.strokeText(String(n), tx, ty);
      ctx.fillStyle = n === 100 ? '#fde68a' : '#d5fbf4';
      ctx.fillText(String(n), tx, ty);
    }
  }

  function drawLadders() {
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.85;
    for (const [bottom, top] of game.ladders || []) {
      const a = cellXY(bottom), b = cellXY(top);
      const ax = px(a.x), ay = py(a.y), bx = px(b.x), by = py(b.y);
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len * cell * 0.13, ny = dx / len * cell * 0.13;
      ctx.strokeStyle = '#e0a84f'; ctx.lineWidth = Math.max(2, cell * 0.075);
      ctx.beginPath();
      ctx.moveTo(ax + nx, ay + ny); ctx.lineTo(bx + nx, by + ny);
      ctx.moveTo(ax - nx, ay - ny); ctx.lineTo(bx - nx, by - ny);
      ctx.stroke();
      ctx.strokeStyle = '#f4d08a'; ctx.lineWidth = Math.max(1.5, cell * 0.05);
      ctx.beginPath();
      const rungs = Math.max(2, Math.floor(len / (cell * 0.34)));
      for (let i = 1; i < rungs; i++) {
        const t = i / rungs, cx2 = ax + dx * t, cy2 = ay + dy * t;
        ctx.moveTo(cx2 + nx, cy2 + ny); ctx.lineTo(cx2 - nx, cy2 - ny);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawSnakes() {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const g of snakeGeo.values()) {
      const pts = [];
      for (let i = 0; i <= 32; i++) { const p = snakePoint(g, i / 32); pts.push([px(p.x), py(p.y)]); }
      const path = () => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); };
      ctx.globalAlpha = 0.93;
      path(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = cell * 0.24; ctx.stroke();
      path(); ctx.strokeStyle = g.color; ctx.lineWidth = cell * 0.19; ctx.stroke();
      path(); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = cell * 0.07; ctx.setLineDash([cell * 0.1, cell * 0.2]); ctx.stroke();
      ctx.setLineDash([]);
      const [tx, ty] = pts[pts.length - 1];
      ctx.fillStyle = g.color; ctx.beginPath(); ctx.arc(tx, ty, cell * 0.06, 0, Math.PI * 2); ctx.fill();
      const [hx, hy] = pts[0];
      ctx.fillStyle = g.color; ctx.beginPath(); ctx.arc(hx, hy, cell * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx - cell * 0.07, hy - cell * 0.04, cell * 0.05, 0, Math.PI * 2); ctx.arc(hx + cell * 0.07, hy - cell * 0.04, cell * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(hx - cell * 0.07, hy - cell * 0.03, cell * 0.022, 0, Math.PI * 2); ctx.arc(hx + cell * 0.07, hy - cell * 0.03, cell * 0.022, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function pawnColor(p) {
    if (game.mode === 'team' && p.team !== null && p.team !== undefined) {
      return TEAM_COLORS[p.team % TEAM_COLORS.length];
    }
    return PAWN_COLORS[(typeof p.c === 'number' ? p.c : hash(p.n)) % PAWN_COLORS.length];
  }

  function drawPawn(p, x, y, sc, showLabel) {
    const hr = Math.max(2.5, cell * 0.17 * sc), bw = Math.max(3, cell * 0.25 * sc);
    const by = y + cell * 0.32 * sc, ty = y - cell * 0.02 * sc, hy = ty - hr * 0.7;
    
    if (p.shield) {
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = Math.max(1.5, cell * 0.07 * sc);
      ctx.beginPath(); ctx.arc(x, y + cell * 0.08 * sc, cell * 0.42 * sc, 0, Math.PI * 2); ctx.stroke();
    }
    
    ctx.fillStyle = pawnColor(p);
    ctx.lineWidth = Math.max(1, cell * 0.045 * sc);
    ctx.strokeStyle = p.r ? '#fbbf24' : 'rgba(0,0,0,.7)';
    ctx.beginPath();
    ctx.moveTo(x - bw, by); ctx.lineTo(x + bw, by); ctx.lineTo(x + bw * 0.35, ty); ctx.lineTo(x - bw * 0.35, ty);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, hy, hr, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(x - hr * 0.35, hy - hr * 0.35, hr * 0.28, 0, Math.PI * 2); ctx.fill();

    if (sc > 0.5 && p.sk) {
      ctx.font = Math.round(cell * 0.34 * sc) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🧊', x - bw - cell * 0.05, hy);
    }
    
    if (p.r) {
      ctx.font = Math.round(cell * 0.5 * Math.max(0.6, sc)) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(MEDALS[p.r - 1] || '🏅', x + bw, hy - hr);
    }
    
    if (showLabel) {
      const label = p.n.length > 10 ? p.n.slice(0, 9) + '…' : p.n;
      ctx.font = '700 ' + Math.round(cell * 0.34) + 'px Poppins, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(7,22,26,.95)';
      const half = ctx.measureText(label).width / 2 + 2;
      const lx = Math.max(half, Math.min(cell * 10 - half, x));
      const ly = hy - hr * 1.5 - 3;
      ctx.strokeText(label, lx, ly);
      ctx.fillStyle = '#fff'; ctx.fillText(label, lx, ly);
    }
  }

  function newDisp(cellNo) {
    const xy = cellXY(cellNo);
    return { x: xy.x, y: xy.y, at: cellNo, pos: cellNo, seq: 0, q: [], hop: null, ox: 0, oy: 0, sc: 1, lift: 0 };
  }

  function snapTo(d, cellNo) {
    const xy = cellXY(cellNo);
    d.q.length = 0; d.hop = null; d.x = xy.x; d.y = xy.y; d.at = cellNo;
  }

  // Sumber ular/tangga yang berujung di kotak t (kepala ular / dasar tangga)
  function jumpSource(t) {
    for (const [h, tl] of game.snakes || []) if (tl === t) return h;
    for (const [b, tp] of game.ladders || []) if (tp === t) return b;
    return 0;
  }

  // Samakan posisi tampilan pion dengan posisi dari server: jalan per kotak, lalu luncur di ular/tangga
  function syncPawn(key, target) {
    let d = disp.get(key);
    if (!d) { d = newDisp(target); disp.set(key, d); return d; }
    if (d.pos === target) return d;
    const from = d.pos;
    d.pos = target;
    if (target <= 0) { snapTo(d, target); return d; }
    const src = jumpSource(target);
    const steps = (a, b) => { for (let c = a + 1; c <= b; c++) d.q.push({ c, slide: false }); };
    if (src && src > from && src - from <= 12) {
      steps(from, src);
      d.q.push({ c: target, slide: true });
    } else if (target > from && target - from <= 12) {
      steps(from, target);
    } else {
      d.q.push({ c: target, slide: true });
    }
    if (d.q.length > MAX_QUEUE) snapTo(d, target);
    return d;
  }

  function tickPawns() {
    const now = performance.now();
    for (const d of disp.values()) {
      for (let guard = 0; guard < 4; guard++) {
        if (!d.hop) {
          const seg = d.q.shift();
          if (!seg) { d.lift = 0; break; }
          const to = cellXY(seg.c);
          const dur = seg.slide ? SLIDE_MS : Math.max(HOP_MIN_MS, HOP_MS - d.q.length * HOP_CATCHUP_MS);
          d.hop = { seg, fx: d.x, fy: d.y, tx: to.x, ty: to.y, t0: now, dur };
        }
        const h = d.hop;
        const u = Math.min(1, (now - h.t0) / h.dur);
        const e = h.seg.slide ? u * u * (3 - 2 * u) : u;
        d.x = h.fx + (h.tx - h.fx) * e;
        d.y = h.fy + (h.ty - h.fy) * e;
        d.lift = h.seg.slide ? 0 : Math.sin(u * Math.PI) * HOP_HEIGHT;
        if (u < 1) break;
        d.at = h.seg.c; d.x = h.tx; d.y = h.ty; d.lift = 0; d.hop = null;
      }
    }
  }

  function paint() {
    if (!game || (!game.board && (!game.snakes || !game.ladders))) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawCells();
    drawLadders();
    drawSnakes();
    drawNumbers();

    tickPawns();
    if (game.mode === 'team' && game.teams) {
      for (const team of game.teams) {
        const d = syncPawn('t' + team.idx, team.pos);
        const p = { n: team.emoji, c: team.idx, team: team.idx, r: team.rank, shield: false, sk: 0 };
        drawPawn(p, px(d.x), py(d.y) - d.lift * cell, 1, true);
      }
    } else {
      const byCell = new Map();
      for (const p of game.players || []) {
        const d = syncPawn('p' + p.n, p.p);
        if (!byCell.has(d.at)) byCell.set(d.at, []);
        byCell.get(d.at).push([p, d]);
      }
      for (const arr of byCell.values()) {
        const n = Math.min(arr.length, 9);
        arr.slice(0, 9).forEach(([p, d], i) => {
          const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
          const step = cell / cols;
          const ox = ((i % cols) - (cols - 1) / 2) * step;
          const oy = (Math.floor(i / cols) - (cols - 1) / 2) * step;
          const sc = cols === 1 ? 1 : cols === 2 ? 0.55 : 0.37;
          drawPawn(p, px(d.x) + ox, py(d.y) + oy - d.lift * cell, sc, n === 1);
        });
      }
    }
  }

  function render() {
    requestAnimationFrame(render);
    paint();
  }
  render();

  function updateLeadStrip() {
    const strip = document.getElementById('leadStrip');
    if (!game || game.phase === 'lobby') {
      strip.innerHTML = '';
      return;
    }

    let leaders = [];
    if (game.mode === 'team') {
      leaders = (game.teams || []).slice(0, LEADERS_IN_STRIP).map(t => ({
        name: t.emoji,
        fullName: t.name,
        pos: t.pos,
        rank: t.rank,
        color: TEAM_COLORS[t.idx % TEAM_COLORS.length],
        stamina: 0,
        members: t.members || [],
        isTeam: true
      }));
    } else {
      leaders = (game.players || []).slice(0, LEADERS_IN_STRIP).map(p => ({
        name: p.n,
        fullName: p.n,
        pos: p.p,
        rank: p.r,
        color: pawnColor(p),
        stamina: p.st || 0,
        isTeam: false
      }));
    }

    strip.innerHTML = leaders.map(l => {
      const isTurn = game.turn === l.name || (game.currentTeam !== null && game.mode === 'team');
      const staminaPercent = Math.min(100, l.stamina);
      return '<div class="lead ' + (l.rank ? 'done' : '') + ' ' + (isTurn ? 'turn' : '') + '">' +
        '<div class="av" style="border-color: ' + l.color + '">' + l.name + '</div>' +
        '<div class="bar" style="background: ' + l.color + '"></div>' +
        (!l.isTeam ? '<div class="staminaBar"><div class="staminaFill" style="width: ' + staminaPercent + '%"></div></div>' : '') +
        '<div class="nm">' + l.fullName + '</div>' +
        '<div class="ps">' + (l.isTeam ? l.members.join(', ') : 'Pos ' + l.pos) + '</div>' +
        '</div>';
    }).join('');
  }

  function showMysteryEffect(effect) {
    const banner = document.getElementById('mysteryBanner');
    const messages = {
      'perisai': '🛡️ PERISAI 10s!',
      'speed': '⚡ SPEED BOOST 2x!',
      'teleport': '🌀 TELEPORT +10!',
      'double': '🎲 DOUBLE LEMPAR!',
      'lucky': '⭐ LUCKY NEXT!',
      'stamina': '💪 +50 STAMINA!',
      'auto-serang': '💥 AUTO SERANG!',
      'freeze-bomb': '🧊 FREEZE BOMB!',
      'swap-curse': '🔀 SWAP CURSE!',
      'snake-drop': '🐍 SNAKE DROP!',
      'chaos-strike': '💀 CHAOS STRIKE!',
      'trap': '🪤 TRAP -5!',
      'dizzy': '😵 DIZZY!',
      'reverse': '⏪ REVERSE!',
      'cursed': '💀 CURSED!'
    };
    banner.textContent = messages[effect] || '❓ MYSTERY!';
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 2500);
  }

  // Hitung mundur lobby dihitung di klien, karena server hanya kirim update saat ada kejadian
  function updateLobbyBar() {
    if (!game || game.phase !== 'lobby') return;
    const turnBar = document.getElementById('turnBar');
    const left = game.lobby.endsAt - (Date.now() + clockOffset);
    turnBar.className = 'lobby';
    turnBar.textContent = game.lobby.endsAt > 0 && left > 0
      ? 'Mulai dalam ' + Math.ceil(left / 1000) + 's... (' + game.totalPlayers + '/' + game.lobby.max + ')'
      : game.lobby.endsAt > 0
        ? 'Memulai...'
        : 'Menunggu ' + game.lobby.min + ' pemain...';
  }

  socket.on('update', (m) => {
    if (!m || m.phase === 'done') return;
    game = m;
    if (m.round !== lastRound) {
      lastRound = m.round;
      disp.clear();
      buildGeo(m);
      layout();
    }
    clockOffset = m.serverTime - Date.now();
    
    document.getElementById('chipMode').textContent = m.mode === 'team' ? 'Team (' + (m.teams || []).length + ')' : 'Solo';
    document.getElementById('chipRound').textContent = 'Ronde ' + m.round;
    document.getElementById('chipFinish').textContent = '🏁 ' + m.finishers.length + '/' + m.winnersNeeded;
    document.getElementById('chipPlayers').textContent = '👥 ' + m.totalPlayers;
    
    if (m.phase === 'racing' && m.endsAt) {
      const left = m.endsAt - m.serverTime;
      document.getElementById('chipTime').textContent = '⏱ ' + fmtTime(left);
    } else {
      document.getElementById('chipTime').textContent = '⏱ --:--';
    }

    const turnBar = document.getElementById('turnBar');
    if (m.phase === 'lobby') {
      updateLobbyBar();
    } else if (m.phase === 'racing' && m.turn) {
      turnBar.className = '';
      if (m.mode === 'team' && m.currentTeam !== null) {
        const team = (m.teams || []).find(t => t.idx === m.currentTeam);
        turnBar.textContent = 'Giliran ' + (team ? team.name : 'Tim') + ': ' + m.turn;
      } else {
        turnBar.textContent = 'Giliran: ' + m.turn;
      }
    } else {
      turnBar.textContent = '';
    }

    const eventBar = document.getElementById('eventBar');
    if (m.event) {
      eventBar.classList.add('show');
      if (m.event.ph === 'warn') {
        eventBar.className = 'warn show';
        const evNames = { storm: '⚠️ BADAI DATANG!', wind: '⚠️ ANGIN SEGAR!', shield: '⚠️ PERISAI MASSAL!', grab: '⚠️ REBUTAN ITEM!' };
        eventBar.textContent = evNames[m.event.t] || '⚠️ EVENT DATANG!';
      } else {
        eventBar.className = 'active show';
        if (m.event.t === 'storm') eventBar.textContent = '🌪️ BADAI! Semua mundur 3';
        else if (m.event.t === 'wind') eventBar.textContent = '💨 ANGIN SEGAR! Semua maju 3';
        else if (m.event.t === 'shield') eventBar.textContent = '🛡️ PERISAI MASSAL! Ular nggak gigit';
        else if (m.event.t === 'grab') eventBar.textContent = '⚡ REBUTAN! Komen "' + m.event.w + '" dapat stamina!';
      }
    } else {
      eventBar.classList.remove('show');
    }

    document.getElementById('app').className = m.event && m.event.ph === 'active' && m.event.t === 'shield' ? 'shield' : '';

    // Show mystery effect if recent roll has mystery effect
    if (m.recentRolls && m.recentRolls.length > 0) {
      const latest = m.recentRolls[m.recentRolls.length - 1];
      // Banner cuma sekali per lemparan (update server datang berkali-kali), dan lewati lemparan lama saat halaman baru dibuka
      if (lastMysterySeq !== null && latest.s !== lastMysterySeq &&
          latest.v && !['snake', 'ladder', 'again', 'trap', 'shielded', 'back', 'fwd'].includes(latest.v)) {
        showMysteryEffect(latest.v);
      }
      lastMysterySeq = latest.s;
    } else if (lastMysterySeq === null) {
      lastMysterySeq = 0;
    }

    updateLeadStrip();
    paint();

    if (m.phase === 'podium' && m.finishers.length > lastFinishCount) {
      lastFinishCount = m.finishers.length;
      showPodium();
    }
  });

  function showPodium() {
    const card = document.getElementById('podiumCard');
    const winners = game.finishers.slice(0, 3);
    let html = '<h2>🏆 JUARA 🏆</h2>';
    for (const w of winners) {
      html += '<div class="podium-row">' +
        '<span class="medal">' + MEDALS[w.rank - 1] + '</span>' +
        '<span class="nm">' + (w.team || w.player) + '</span>' +
        '<span class="pt">+' + w.points + '</span>' +
        '</div>';
    }
    if (game.mode === 'team') {
      html += '<p class="podium-note">Semua anggota tim dapat poin!</p>';
    }
    card.innerHTML = html;
    document.getElementById('podium').classList.add('show');
    setTimeout(() => {
      document.getElementById('podium').classList.remove('show');
      lastFinishCount = 0;
    }, 7000);
  }

  socket.on('connect', () => {
    socket.emit('join-overlay');
  });

  setInterval(updateLobbyBar, 250);

  setInterval(() => {
    if (game && game.phase === 'racing' && game.endsAt) {
      const left = game.endsAt - (Date.now() + clockOffset);
      document.getElementById('chipTime').textContent = '⏱ ' + fmtTime(left);
    }
  }, 1000);
})();
</script>
</body>
</html>
