<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sambung Kata Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1d2e">
<style>
:root{--bg:#120d22;--surface:#1d1633;--line:#322857;--paper:#f1ecdf;--ink:#1a1030;--text:#f3f1fa;--muted:#9a93b8;--accent:#8b5cf6;--ok:#34d399;--gold:#f5b84a;--w:clamp(110px,34vw,150px)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(160deg,#120d22,#1b1233);color:var(--text);overflow:hidden;height:100vh;height:100dvh}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px 12px calc(6px + env(safe-area-inset-bottom))}
#letterPanel{flex:none;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
#letterWheel{position:relative;width:var(--w);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:#150f29}
#progressText{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-weight:800;color:var(--muted)}
#progressText .num-solved{font-size:calc(var(--w)*.24);color:var(--ok)}
#progressText .of{font-size:calc(var(--w)*.1);font-weight:600}
.letter-bubble{position:absolute;width:21%;height:21%;margin:-10.5% 0 0 -10.5%;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);border-radius:50%;font-weight:800;font-size:calc(var(--w)*.115);box-shadow:0 2px 6px rgba(0,0,0,.35)}
#letterPanel.done #letterWheel{border-color:var(--ok)}
#leaderboard{min-width:0}
#lbList{display:flex;flex-direction:column;gap:6px}
.lb-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:10px;font-size:.82rem;min-width:0}
.lb-rank{flex:none;width:18px;text-align:center;font-weight:800;color:var(--muted)}
.lb-row:nth-child(1) .lb-rank{color:var(--gold)}
.lb-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{flex:none;font-weight:700;color:#b9a4ff}
.empty-hint{color:var(--muted);font-size:.85rem;padding:4px 2px}
#voteHintInline{grid-column:1/-1;width:100%;min-width:0;overflow:hidden;white-space:nowrap;font-size:.76rem;font-weight:600;color:var(--muted);-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
#voteHintInline b{color:var(--gold);font-weight:800}
#voteHintInline .marquee-track{display:inline-block;padding-left:100%;animation:marqueeScroll 22s linear infinite}
@keyframes marqueeScroll{to{transform:translateX(-100%)}}
#gridWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#grid{display:grid;gap:3px}
.cell{position:relative}
.cell.open{background:var(--paper);border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.cell .num{position:absolute;top:1px;left:3px;font-size:.28em;font-weight:700;color:#6d4fd6;line-height:1}
.cell .letter{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:.58em}
#answerWrap{flex:none;position:relative}
#answerList{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-height:26vh;overflow:hidden}
.answer-slot{display:inline-flex;align-items:center;gap:7px;padding:3px 11px 3px 4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:.78rem}
.slot-number{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--line);font-size:.68rem;font-weight:800;color:var(--muted)}
.slot-content{font-weight:700;letter-spacing:2px;color:var(--muted)}
.answer-slot.found{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.12)}
.answer-slot.found .slot-number{background:var(--ok);color:#062b1d}
.answer-slot.found .slot-content{color:var(--text);letter-spacing:1px}
.answer-slot.reveal{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
#toast{position:absolute;bottom:6px;left:50%;transform:translate(-50%,20px);background:var(--accent);color:#fff;padding:.5rem 1.1rem;border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none;z-index:5}
#toast.show{transform:translate(-50%,0);opacity:1}
#avatarZone{flex:0 0 64px;position:relative;overflow:visible}
.mini-avatar{position:absolute;bottom:2px;display:flex;flex-direction:column;align-items:center;pointer-events:none;will-change:left}
.mini-avatar .emoji{display:block;font-size:26px;line-height:1;animation:avatarBob .5s ease-in-out infinite alternate}
.mini-avatar.facing-right .emoji{transform:scaleX(-1)}
.mini-avatar .name-tag{order:-1;font-weight:700;font-size:.68rem;color:var(--text);background:rgba(0,0,0,.5);padding:.1rem .5rem;border-radius:50px;margin-bottom:.2rem;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.mini-avatar .comment-bubble{order:-2;font-weight:600;font-size:.74rem;color:var(--ink);background:var(--paper);padding:.25rem .65rem;border-radius:10px;margin-bottom:.3rem;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;position:relative}
@keyframes avatarBob{to{transform:translateY(-4px)}}
#banner{position:fixed;bottom:12vh;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);padding:.7rem 1.3rem;border-radius:999px;font-weight:600;font-size:.9rem;display:none;z-index:10}
#banner.show{display:block}
@media (orientation:landscape) and (min-aspect-ratio:1/1){
:root{--w:min(24vh,20vw)}
#app{display:grid;grid-template-columns:minmax(230px,30%) 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top grid" "answers grid" "avatars avatars";gap:10px 14px}
#letterPanel{grid-area:top;grid-template-columns:1fr;justify-items:center}
#gridWrap{grid-area:grid}#answerWrap{grid-area:answers;min-height:0}#avatarZone{grid-area:avatars}
#leaderboard{width:100%}#answerList{max-height:none}
}
</style>
</head>
<body>
  <div id="app">
    <div id="letterPanel">
      <div id="letterWheel"><div id="progressText">Menunggu soal...</div></div>
      <div id="leaderboard"><div id="lbList"><div class="empty-hint">Belum ada yang jawab</div></div></div>
      <div id="voteHintInline"><div class="marquee-track">💬 Komen <b>SKIP 10x</b> rame-rame kalo kesulitan &nbsp;•&nbsp; ketik <b>GANTI 10x</b> buat ganti game &nbsp;•&nbsp; kalo kalian nggak bisa nerima kenyataan dari kekalahan, komen <b>NYERAH 10x</b> 🤣🤣🤣 niscaya aku kasih jawabannya</div></div>
    </div>
    <div id="gridWrap"><div id="grid"></div><div id="toast"></div></div>
    <div id="answerWrap"><div id="answerList"></div></div>
    <div id="avatarZone"></div>
  </div>

  <div id="banner"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>const socket = io();</script>
  <script src="/shared/v2-bootstrap.js"></script>
  <script src="/shared/game-switch-watcher.js"></script>
  <script>
    const answerListEl = document.getElementById('answerList');
    const answerWrap = document.getElementById('answerWrap');
    const toastEl = document.getElementById('toast');
    const letterPanelEl = document.getElementById('letterPanel');
    const letterWheelEl = document.getElementById('letterWheel');
    const progressTextEl = document.getElementById('progressText');
    const lbList = document.getElementById('lbList');
    const bannerEl = document.getElementById('banner');

    let currentPuzzle = null;
    let currentBaseLetters = null;
    let toastTimer = null;
    let prevAnswerStates = new Map();

    function renderAnswerList(data) {
      currentPuzzle = data;
      answerListEl.innerHTML = '';
      data.words.forEach((w) => {
        const slot = document.createElement('div');
        slot.className = 'answer-slot';
        const wordKey = `${w.number}-${w.direction}`;
        if (w.answer) {
          slot.classList.add('found');
          if (!prevAnswerStates.has(wordKey)) slot.classList.add('reveal');
          prevAnswerStates.set(wordKey, true);
        }
        const numberEl = document.createElement('div');
        numberEl.className = 'slot-number';
        numberEl.textContent = w.number;
        const contentEl = document.createElement('div');
        contentEl.className = 'slot-content';
        contentEl.textContent = w.answer ? w.answer : '?'.repeat(w.length);
        slot.appendChild(numberEl);
        slot.appendChild(contentEl);
        answerListEl.appendChild(slot);
      });
    }

    // Peta kotak dibangun dari words (sama seperti game TTS), server nggak kirim "board".
    function buildCellMap(rows, cols, words) {
      const map = Array.from({ length: rows }, () => Array(cols).fill(null));
      words.forEach(w => {
        for (let i = 0; i < w.length; i++) {
          const r = w.row + (w.direction === 'down' ? i : 0);
          const c = w.col + (w.direction === 'across' ? i : 0);
          if (!map[r] || c >= cols) continue;
          if (!map[r][c]) map[r][c] = { number: null, letter: '' };
          if (i === 0 && !map[r][c].number) map[r][c].number = w.number;
          if (w.answer) map[r][c].letter = w.answer[i];
        }
      });
      return map;
    }

    let lastGridData = null;
    function renderGrid(data) {
      lastGridData = data;
      const gridEl = document.getElementById('grid');
      const gridWrap = document.getElementById('gridWrap');
      const { rows, cols, words } = data || {};
      if (!rows || !cols || !words) { gridEl.innerHTML = ''; return; }
      const gap = 3;
      const availW = gridWrap.clientWidth, availH = gridWrap.clientHeight;
      if (!availW || !availH) return;
      const cellSize = Math.max(10, Math.min(72, Math.floor(Math.min((availW - gap * (cols - 1)) / cols, (availH - gap * (rows - 1)) / rows))));
      const map = buildCellMap(rows, cols, words);
      gridEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
      gridEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
      gridEl.style.fontSize = `${cellSize}px`;
      gridEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cellData = map[r][c];
          const div = document.createElement('div');
          div.className = 'cell' + (cellData ? ' open' : '');
          if (cellData) {
            if (cellData.number) {
              const num = document.createElement('div');
              num.className = 'num';
              num.textContent = cellData.number;
              div.appendChild(num);
            }
            const letter = document.createElement('div');
            letter.className = 'letter';
            letter.textContent = cellData.letter || '';
            div.appendChild(letter);
          }
          gridEl.appendChild(div);
        }
      }
    }
    if (window.ResizeObserver) {
      let raf = 0;
      new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => lastGridData && renderGrid(lastGridData)); })
        .observe(document.getElementById('gridWrap'));
    }

    function renderLetterWheel(baseLetters) {
      if (currentBaseLetters === baseLetters) return;
      currentBaseLetters = baseLetters;
      letterWheelEl.querySelectorAll('.letter-bubble').forEach(el => el.remove());
      if (!baseLetters) return;
      const letters = baseLetters.split('');
      const n = letters.length;
      const radius = 39; // % dari diameter, pusat bubble tepat di tengah ring
      letters.forEach((ch, i) => {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2;
        const bubble = document.createElement('div');
        bubble.className = 'letter-bubble';
        bubble.textContent = ch;
        bubble.style.left = `${50 + radius * Math.cos(angle)}%`;
        bubble.style.top = `${50 + radius * Math.sin(angle)}%`;
        letterWheelEl.appendChild(bubble);
      });
    }

    function renderProgress(words) {
      const total = words.length;
      const solved = words.filter(w => w.answer).length;
      if (solved === total && total > 0) {
        letterPanelEl.classList.add('done');
        progressTextEl.innerHTML = '<span class="num-solved">✓</span><span class="of">selesai</span>';
      } else {
        letterPanelEl.classList.remove('done');
        progressTextEl.innerHTML = `<span class="num-solved">${solved}</span><span class="of">/ ${total} kata</span>`;
      }
    }

    function renderLeaderboard(list) {
      if (!list || list.length === 0) {
        lbList.innerHTML = '<div class="empty-hint">Belum ada yang jawab</div>';
        return;
      }
      lbList.innerHTML = list.slice(0, 3).map((row, i) => `
        <div class="lb-row">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${escapeHtml(row.player)}</span>
          <span class="lb-score">${row.score}</span>
        </div>`).join('');
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showToast(data) {
      toastEl.textContent = `${data.player} benar! ${data.answer ? data.answer.toUpperCase() : ''}`;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    function showBanner(text) { bannerEl.textContent = text; bannerEl.classList.add('show'); }
    function hideBanner() { bannerEl.classList.remove('show'); }

    const avatarZone = document.getElementById('avatarZone');
    const activeAvatars = {};

    function spawnAvatar(player, emoji, profileUrl, avatarType) {
      if (activeAvatars[player]) return;
      const el = document.createElement('div');
      el.className = 'mini-avatar';
      let avatarHtml = `<span class="emoji">${emoji}</span>`;
      if (avatarType === 'tiktok' && profileUrl) {
         avatarHtml = `<img src="${profileUrl}" onerror="this.outerHTML='<span class=\\'emoji\\'>${emoji}</span>'" style="width:24px;height:24px;border-radius:50%;object-fit:cover;margin-right:2px;border:1px solid #fff;display:inline-block;vertical-align:middle;" />`;
      }
      el.innerHTML = `${avatarHtml}<span class="name-tag">${player}</span>`;
      avatarZone.appendChild(el);
      const startLeft = Math.random() * Math.max(0, avatarZone.clientWidth - 40);
      el.style.left = startLeft + 'px';
      activeAvatars[player] = { el, timer: null };
      walkRandomly(player);
    }

    function walkRandomly(player) {
      const entry = activeAvatars[player];
      if (!entry) return;
      const zoneWidth = avatarZone.clientWidth || 300;
      const avatarWidth = entry.el.offsetWidth || 40;
      const maxLeft = Math.max(0, zoneWidth - avatarWidth);
      const currentLeft = parseFloat(entry.el.style.left) || 0;
      const targetLeft = Math.random() * maxLeft;
      const duration = 2.5 + Math.random() * 3;
      entry.el.classList.toggle('facing-right', targetLeft > currentLeft);
      entry.el.style.transition = `left ${duration}s linear`;
      entry.el.style.left = targetLeft + 'px';
      entry.timer = setTimeout(() => walkRandomly(player), duration * 1000);
    }

    function showComment(player, text) {
      const entry = activeAvatars[player];
      if (!entry) return;
      let bubble = entry.el.querySelector('.comment-bubble');
      if (!bubble) {
        bubble = document.createElement('span');
        bubble.className = 'comment-bubble';
        entry.el.appendChild(bubble);
      }
      bubble.textContent = text;
      clearTimeout(entry.commentTimer);
      entry.commentTimer = setTimeout(() => bubble.remove(), 4000);
    }

    function clearAllAvatars() {
      Object.values(activeAvatars).forEach(({ el, timer, commentTimer }) => {
        clearTimeout(timer);
        clearTimeout(commentTimer);
        el.remove();
      });
      for (const key in activeAvatars) delete activeAvatars[key];
    }

    function removeAvatar(player) {
      const entry = activeAvatars[player];
      if (!entry) return;
      clearTimeout(entry.timer);
      clearTimeout(entry.commentTimer);
      entry.el.remove();
      delete activeAvatars[player];
    }

    socket.on('avatar:spawn', (data) => spawnAvatar(data.player, data.emoji, data.profileUrl, data.avatarType));
    socket.on('avatar:sync', (list) => { clearAllAvatars(); list.forEach((d) => spawnAvatar(d.player, d.emoji, d.profileUrl, d.avatarType)); });
    socket.on('avatar:reset', clearAllAvatars);
    socket.on('avatar:remove', ({ player }) => removeAvatar(player));
    socket.on('chat:comment', ({ player, text }) => showComment(player, text));

    socket.on('game:switched', () => window.location.reload());
    socket.on('update', (data) => {
      renderAnswerList(data);
      renderLetterWheel(data.baseLetters);
      renderProgress(data.words);
      renderGrid(data);
    });
    socket.on('answer:correct', (data) => showToast(data));
    socket.on('leaderboard:update', (list) => renderLeaderboard(list));
    socket.on('puzzle:completed', () => showBanner('🎉 Semua kata ketemu! Menyiapkan soal baru...'));
    socket.on('puzzle:new', () => { currentBaseLetters = null; prevAnswerStates.clear(); hideBanner(); });
    socket.on('puzzle:error', (data) => { showBanner('⚠️ ' + data.message); setTimeout(hideBanner, 4000); });

    let wakeLock = null;
    let noSleepStarted = false;

    function startNoSleepFallback() {
      if (noSleepStarted) return;
      noSleepStarted = true;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 2; canvas.height = 2;
        canvas.getContext('2d').fillRect(0, 0, 2, 2);
        const stream = canvas.captureStream(1);
        const video = document.createElement('video');
        video.muted = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('autoplay', '');
        video.style.cssText = 'position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;';
        video.srcObject = stream;
        document.body.appendChild(video);
        video.play().catch(() => {});
      } catch (e) {
        console.error('⚠️ Fallback nahan layar gagal:', e.message);
      }
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          return;
        } catch (e) {
          console.error('⚠️ Wake Lock API gagal, pakai fallback:', e.message);
        }
      }
      startNoSleepFallback();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLock === null) requestWakeLock();
    });

    requestWakeLock();

    document.body.addEventListener('click', function goFullscreen() {
      document.documentElement.requestFullscreen().catch(() => {});
      requestWakeLock();
      document.body.removeEventListener('click', goFullscreen);
    }, { once: true });
  </script>
  <script src="/shared/vote-overlay.js"></script>
</body>
</html>
