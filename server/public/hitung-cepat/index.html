<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitung Cepat Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0a1f">
<style>
:root{--bg:#120d22;--surface:#1d1633;--line:#322857;--paper:#f1ecdf;--ink:#1a1030;--text:#f3f1fa;--muted:#9a93b8;--accent:#8b5cf6;--ok:#34d399;--gold:#f5b84a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(160deg,#120d22,#1b1233);color:var(--text);overflow:hidden;height:100vh;height:100dvh}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px 12px;position:relative;z-index:1}
.header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-size:1.15rem;font-weight:800;letter-spacing:.2px}
.title small{margin-left:8px;font-size:.8rem;font-weight:600;color:var(--gold)}
.progress-info{font-size:.95rem;font-weight:700;color:var(--muted);white-space:nowrap}
.progress-info span{color:var(--ok);font-size:1.15rem}
.bar{flex:none;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s ease}
#voteHintInline{flex:none;overflow:hidden;white-space:nowrap;font-size:.76rem;font-weight:600;color:var(--muted);-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
#voteHintInline b{color:var(--gold);font-weight:800}
#voteHintInline .marquee-track{display:inline-block;padding-left:100%;animation:hcMarquee 26s linear infinite}
@keyframes hcMarquee{to{transform:translateX(-100%)}}
.grid-container{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.question-slot{container-type:size;position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slot-number{position:absolute;top:7px;left:8px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--line);color:var(--muted);font-size:.72rem;font-weight:800}
.question-text{font-weight:800;font-size:min(34cqh,12cqw);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--paper)}
.question-text em{font-style:normal;color:var(--muted);margin-left:.25em}
.winner-name{margin-top:5px;max-width:90%;font-size:.74rem;font-weight:700;color:#062b1d;background:var(--ok);padding:.1rem .6rem;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.question-slot:not(.solved) .winner-name{display:none}
.question-slot.solved{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.55)}
.question-slot.solved .slot-number{background:var(--ok);color:#062b1d}
.question-slot.solved .question-text{color:var(--muted);font-size:min(26cqh,9cqw)}
.question-slot.solved .question-text em{color:var(--ok);font-size:1.35em;font-weight:900}
.question-slot.fresh{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
#leaderboard{position:fixed;right:8px;bottom:8px;z-index:10;background:rgba(29,22,51,.9);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem}
#leaderboard .label{font-size:.78rem;font-weight:700;color:var(--gold);margin-bottom:.4rem}
#lbList{display:flex;flex-direction:column;gap:.3rem}
.lb-row{display:flex;align-items:center;gap:.5rem;font-size:.8rem;min-width:0}
.lb-rank{flex:none;width:18px;text-align:center;font-weight:800;color:var(--muted)}
.lb-row:nth-child(1) .lb-rank{color:var(--gold)}
.lb-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{flex:none;font-weight:700;color:#b9a4ff}
.empty-hint{color:var(--muted);font-size:.8rem;text-align:center}
#avatarZone{flex:none;height:clamp(70px,10vh,110px);position:relative;overflow:visible}
.mini-avatar{position:absolute;bottom:2px;display:flex;flex-direction:column;align-items:center;pointer-events:none;will-change:left}
.mini-avatar .emoji{display:block;font-size:26px;line-height:1;animation:avatarBob .5s ease-in-out infinite alternate}
.mini-avatar.facing-right .emoji{transform:scaleX(-1)}
.mini-avatar .name-tag{order:-1;font-weight:700;font-size:.66rem;color:var(--text);background:rgba(0,0,0,.5);padding:.1rem .5rem;border-radius:50px;margin-bottom:.15rem;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
@keyframes avatarBob{to{transform:translateY(-4px)}}
/* script bersama (v2-bootstrap) maksa avatarZone setinggi 120-170px; di sini dipendekkan supaya 8 soal muat */
#app #avatarZone{height:clamp(84px,11vh,120px) !important}
@media (orientation:landscape) and (min-aspect-ratio:1/1){
.grid-container{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:10px}
.title{font-size:1.4rem}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1 class="title">Hitung Cepat<small>Ronde <span id="round-number">1</span></small></h1>
    <div class="progress-info"><span id="solved-count">0</span>/<span id="total-count" style="color:inherit;font-size:inherit">8</span> terjawab</div>
  </div>
  <div class="bar"><i id="bar-fill"></i></div>
  <div id="voteHintInline"><div class="marquee-track">💬 Komen <b>SKIP 10x</b> rame-rame kalo kesulitan &nbsp;•&nbsp; ketik <b>GANTI 10x</b> buat ganti game</div></div>
  <div class="grid-container" id="grid"></div>
  <div id="avatarZone"></div>
</div>
<div id="leaderboard">
  <div class="label">🏆 Leaderboard</div>
  <div id="lbList"><div class="empty-hint">Belum ada yang jawab</div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>const socket = io();</script>
<script src="/shared/v2-bootstrap.js"></script>
<script src="/shared/game-switch-watcher.js"></script>
<script>
const grid = document.getElementById('grid');
const lbList = document.getElementById('lbList');
let prevSolved = new Set();
let prevRound = null;
const OPS = { '*': '×', '-': '−', '/': '÷' };
function prettyQuestion(q) {
  return String(q).replace(' = ?', '').replace(/[*\-\/]/g, c => OPS[c] || c);
}
function renderQuestions(questions, roundNumber) {
  if (prevRound !== roundNumber) { prevSolved = new Set(); prevRound = roundNumber; }
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const slot = document.createElement('div');
    slot.className = 'question-slot' + (q.solved ? ' solved' : '');
    if (q.solved && !prevSolved.has(index)) slot.classList.add('fresh');
    if (q.solved) prevSolved.add(index);
    const slotNumber = document.createElement('div');
    slotNumber.className = 'slot-number';
    slotNumber.textContent = index + 1;
    const questionText = document.createElement('div');
    questionText.className = 'question-text';
    questionText.textContent = prettyQuestion(q.question) + ' ';
    const eq = document.createElement('em');
    eq.textContent = q.solved && q.answer !== null && q.answer !== undefined ? '= ' + q.answer : '= ?';
    questionText.appendChild(eq);
    const winnerName = document.createElement('div');
    winnerName.className = 'winner-name';
    winnerName.textContent = q.solved && q.winner ? q.winner.name : '';
    slot.appendChild(slotNumber);
    slot.appendChild(questionText);
    slot.appendChild(winnerName);
    grid.appendChild(slot);
  });
}
function renderLeaderboard(leaderboard) {
  if (!leaderboard || leaderboard.length === 0) {
    lbList.innerHTML = '<div class="empty-hint">Belum ada yang jawab</div>';
    return;
  }
  lbList.innerHTML = leaderboard.slice(0, 10).map((entry, index) => {
    const name = String(entry.player).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    return '<div class="lb-row"><div class="lb-rank">' + (index + 1) + '</div><div class="lb-name">' + name + '</div><div class="lb-score">' + entry.score + '</div></div>';
  }).join('');
}
socket.on('update', (state) => {
  const qs = state.questions || [];
  const total = qs.length || 8;
  const solved = state.solvedCount || 0;
  document.getElementById('round-number').textContent = state.roundNumber || 1;
  document.getElementById('solved-count').textContent = solved;
  document.getElementById('total-count').textContent = total;
  document.getElementById('bar-fill').style.width = (total ? (solved / total) * 100 : 0) + '%';
  if (qs.length > 0) renderQuestions(qs, state.roundNumber || 1);
  if (state.leaderboard) renderLeaderboard(state.leaderboard);
});

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
socket.on('leaderboard:update', (list) => renderLeaderboard(list));

const avatarZone = document.getElementById('avatarZone');
const activeAvatars = {};
function spawnAvatar(player, emoji, profileUrl, avatarType) {
  if (activeAvatars[player]) return;
  const el = document.createElement('div');
  el.className = 'mini-avatar';
  let avatarHtml = `<span class="emoji">${emoji}</span>`;
  if (avatarType === 'tiktok' && profileUrl) {
    avatarHtml = `<img src="${profileUrl}" onerror="this.outerHTML='<span class=\\'emoji\\'>${emoji}</span>'" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid #fff;display:block;" />`;
  }
  el.innerHTML = `${avatarHtml}<span class="name-tag">${escapeHtml(player)}</span>`;
  avatarZone.appendChild(el);
  el.style.left = Math.random() * Math.max(0, avatarZone.clientWidth - 40) + 'px';
  activeAvatars[player] = { el, timer: null };
  walkRandomly(player);
}
function walkRandomly(player) {
  const entry = activeAvatars[player];
  if (!entry) return;
  const maxLeft = Math.max(0, (avatarZone.clientWidth || 300) - (entry.el.offsetWidth || 40));
  const currentLeft = parseFloat(entry.el.style.left) || 0;
  const targetLeft = Math.random() * maxLeft;
  const duration = 2.5 + Math.random() * 3;
  entry.el.classList.toggle('facing-right', targetLeft > currentLeft);
  entry.el.style.transition = `left ${duration}s linear`;
  entry.el.style.left = targetLeft + 'px';
  entry.timer = setTimeout(() => walkRandomly(player), duration * 1000);
}
function clearAllAvatars() {
  Object.values(activeAvatars).forEach(({ el, timer, commentTimer }) => { clearTimeout(timer); clearTimeout(commentTimer); el.remove(); });
  for (const k in activeAvatars) delete activeAvatars[k];
}
function removeAvatar(player) {
  const e = activeAvatars[player];
  if (!e) return;
  clearTimeout(e.timer); clearTimeout(e.commentTimer); e.el.remove();
  delete activeAvatars[player];
}
socket.on('avatar:spawn', (d) => spawnAvatar(d.player, d.emoji, d.profileUrl, d.avatarType));
socket.on('avatar:sync', (list) => { clearAllAvatars(); list.forEach((d) => spawnAvatar(d.player, d.emoji, d.profileUrl, d.avatarType)); });
socket.on('avatar:reset', clearAllAvatars);
socket.on('avatar:remove', ({ player }) => removeAvatar(player));
let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeLock === null) requestWakeLock();
});
requestWakeLock();
// Fullscreen: masuk saat klik pertama, auto-restore kalau keluar tanpa sengaja
let fsLocked = false;
function enterFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  requestWakeLock();
}
document.body.addEventListener('click', function goFullscreen() {
  fsLocked = true;
  enterFullscreen();
}, { once: true });
document.addEventListener('fullscreenchange', () => {
  // Kalau fullscreen keluar tapi bukan karena user tekan Esc/F11
  if (!document.fullscreenElement && fsLocked) {
    setTimeout(enterFullscreen, 300);
  }
});
</script>
<script src="/shared/vote-overlay.js"></script>
</body>
</html>
